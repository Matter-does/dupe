name: J2 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  j2-native:
    runs-on: macos-15

    env:
      J2_VERSION: 0.1.0
      J2_SHA256: 6fda8338791730cf7937362acd03e29247719e65785458e62988e1789c842e75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          echo "Architecture: $(uname -m)"
          test "$(uname -m)" = "arm64"

      - name: Download J2 0.1.0
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/j2"
          mkdir -p "$ROOT"
          cd "$ROOT"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            -o j2.tar.gz \
            "https://github.com/JasnamSinghArora/j2/releases/download/v${J2_VERSION}/j2-${J2_VERSION}-aarch64-apple-darwin.tar.gz"

          printf '%s  %s\n' "$J2_SHA256" j2.tar.gz | shasum -a 256 -c -

          tar -xzf j2.tar.gz

          echo "=== Extracted archive ==="
          find "$ROOT" -maxdepth 3 -print | sort

      - name: Locate J2 installation
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/j2"

          INSTALL_SH="$(find "$ROOT" -type f -name install.sh -print -quit)"

          if [[ -z "$INSTALL_SH" ]]; then
            echo "ERROR: install.sh was not found."
            exit 1
          fi

          J2_DIR="$(dirname "$INSTALL_SH")"

          echo "J2 directory: $J2_DIR"

          echo "J2_DIR=$J2_DIR" >> "$GITHUB_ENV"

      - name: Install J2
        shell: bash
        run: |
          set -euo pipefail

          cd "$J2_DIR"
          chmod +x ./install.sh
          ./install.sh

      - name: Verify J2 installation
        shell: bash
        run: |
          set -euo pipefail

          echo "=== PATH ==="
          echo "$PATH"

          echo
          echo "=== ~/.j2 ==="
          if [[ -d "$HOME/.j2" ]]; then
            find "$HOME/.j2" -maxdepth 3 -print | sort
          fi

          echo
          echo "=== Commands ==="
          command -v j2 || true
          command -v j || true

          if [[ -x "$HOME/.j2/bin/j2" ]]; then
            echo "$HOME/.j2/bin" >> "$GITHUB_PATH"
          fi

          if [[ -x "$HOME/.j2/bin/j" ]]; then
            echo "$HOME/.j2/bin" >> "$GITHUB_PATH"
          fi

      - name: J2 version
        shell: bash
        run: |
          set -euo pipefail
          j2 --version

      - name: J2 interpreter smoke test
        shell: bash
        run: |
          set -euo pipefail

          printf 'print("hello from dupe CI")\n' > "$RUNNER_TEMP/hello.j2"

          j "$RUNNER_TEMP/hello.j2"

      - name: J2 native build smoke test
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          j2 build \
            "$RUNNER_TEMP/hello.j2" \
            -o build/hello

          test -x build/hello

          echo "=== Native binary ==="
          file build/hello

          echo "=== Native execution ==="
          ./build/hello

      - name: Finish validation
        shell: bash
        run: |
          set -euo pipefail

          echo "J2 0.1.0 validation completed successfully."
