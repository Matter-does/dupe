      - name: Install J2 0.1.0
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/j2"
          mkdir -p "$ROOT"
          cd "$ROOT"

          curl --fail --location --silent --show-error \
            -o j2.tar.gz \
            "https://github.com/JasnamSinghArora/j2/releases/download/v${J2_VERSION}/j2-${J2_VERSION}-aarch64-apple-darwin.tar.gz"

          printf '%s  %s\n' "$J2_SHA256" j2.tar.gz | shasum -a 256 -c -

          tar -xzf j2.tar.gz

          echo "=== Archive layout ==="
          find "$ROOT" -maxdepth 3 -print | sort

          INSTALL_SH="$(find "$ROOT" -type f -name install.sh -print -quit)"
          J2_BIN="$(find "$ROOT" -type f -name j2 -perm -111 -print -quit)"

          if [[ -z "$INSTALL_SH" ]]; then
            echo "ERROR: install.sh was not found."
            exit 1
          fi

          if [[ -z "$J2_BIN" ]]; then
            echo "ERROR: executable j2 was not found."
            exit 1
          fi

          J2_DIR="$(dirname "$INSTALL_SH")"

          echo "Detected J2 directory: $J2_DIR"
          echo "Detected J2 binary: $J2_BIN"

          cd "$J2_DIR"
          ./install.sh

          echo "$(dirname "$J2_BIN")" >> "$GITHUB_PATH"

          if [[ -d "$HOME/.j2/bin" ]]; then
            echo "$HOME/.j2/bin" >> "$GITHUB_PATH"
          fi

          if [[ -d "$HOME/.j2" ]]; then
            echo "$HOME/.j2" >> "$GITHUB_PATH"
          fi