name: T005 Baseline Benchmark

on:
  workflow_dispatch:
    inputs:
      scale:
        description: 'Corpus scale factor (e.g. 0.1 for CI budget, 1.0 for full standard)'
        required: false
        default: '0.1'
      runs:
        description: 'Number of measured iterations for filesystem workloads'
        required: false
        default: '3'
  push:
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'tests/**'
      - '.github/workflows/t005-baseline-benchmark.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  J2_VERSION: 0.1.0
  J2_SHA256: 6fda8338791730cf7937362acd03e29247719e65785458e62988e1789c842e75

jobs:
  macos-benchmark:
    name: Baseline benchmark on macOS Apple Silicon (arm64)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          echo "Architecture: $(uname -m)"
          test "$(uname -m)" = "arm64"

      - name: Install exact J2
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/j2"
          mkdir -p "$d"
          cd "$d"
          curl -fsSL --retry 3 --retry-delay 2 -o j2.tgz \
            "https://github.com/JasnamSinghArora/j2/releases/download/v${J2_VERSION}/j2-${J2_VERSION}-aarch64-apple-darwin.tar.gz"
          printf '%s  j2.tgz\n' "$J2_SHA256" | shasum -a 256 -c -
          tar -xzf j2.tgz
          s="$(find "$d" -type f -name install.sh -print -quit)"
          test -n "$s"
          cd "$(dirname "$s")"
          chmod +x install.sh
          ./install.sh
          echo "$HOME/.j2/bin" >> "$GITHUB_PATH"

      - name: Verify exact J2 version
        shell: bash
        run: |
          set -euo pipefail
          v="$(j2 --version)"
          echo "Detected J2 version: $v"
          test "$v" = "j2 0.1.0"

      - name: Verify source formatting
        shell: bash
        run: |
          set -euo pipefail
          j2 fmt -w src/*.j2
          git diff --stat
          git diff --exit-code src/

      - name: Run harness offline tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_benchmark_harness.py -v

      - name: Probe J2 CLI argv behavior
        shell: bash
        run: |
          set +e
          echo "=== 1. J2 CLI Help ==="
          j2 --help
          echo "=== 2. J2 run Help ==="
          j2 run --help
          echo "=== 3. Probe proc.argv() ==="
          printf 'print("ARGV:", proc.argv())\n' > "$RUNNER_TEMP/probe_argv.j2"
          echo "Test A: j2 run --allow-fs probe_argv.j2 foo bar"
          j2 run --allow-fs "$RUNNER_TEMP/probe_argv.j2" foo bar
          echo "Test B: j2 --allow-fs run probe_argv.j2 foo bar"
          j2 --allow-fs run "$RUNNER_TEMP/probe_argv.j2" foo bar
          echo "Test C: j2 --allow-fs probe_argv.j2 foo bar"
          j2 --allow-fs "$RUNNER_TEMP/probe_argv.j2" foo bar
          echo "=== 4. Test main.j2 execution ==="
          mkdir -p "$RUNNER_TEMP/testdir"
          echo "hello" > "$RUNNER_TEMP/testdir/file1.txt"
          echo "4a: j2 run --allow-fs src/main.j2 $RUNNER_TEMP/testdir --json"
          j2 run --allow-fs src/main.j2 "$RUNNER_TEMP/testdir" --json
          echo "4b: j2 --allow-fs run src/main.j2 $RUNNER_TEMP/testdir --json"
          j2 --allow-fs run src/main.j2 "$RUNNER_TEMP/testdir" --json
          echo "4c: j2 --allow-fs src/main.j2 $RUNNER_TEMP/testdir --json"
          j2 --allow-fs src/main.j2 "$RUNNER_TEMP/testdir" --json
          echo "=== 5. Test C1 mini generation and direct execution ==="
          python3 benchmarks/generator/generate.py --corpus C1 --scale 0.01 --out-dir "$RUNNER_TEMP/c1_probe"
          echo "5a. Interpreter execution:"
          time j2 --allow-fs src/main.j2 "$RUNNER_TEMP/c1_probe" --json
          echo "5b. Native build and execution:"
          mkdir -p build
          j2 build src/main.j2 -o build/dupe
          time J2_ALLOW_FS=1 ./build/dupe "$RUNNER_TEMP/c1_probe" --json

      - name: Run baseline benchmarks (Baseline A, Baseline B, Baseline C)
        shell: bash
        run: |
          set -euo pipefail
          scale="${{ github.event.inputs.scale || '0.01' }}"
          runs="${{ github.event.inputs.runs || '3' }}"
          echo "Running benchmarks with scale=$scale, runs=$runs..."
          python3 benchmarks/run_baselines.py \
            --corpora C1,C2,C4,C5,C6,C7 \
            --scale "$scale" \
            --runs "$runs" \
            --warmup 1 \
            --control-runs 7 \
            --control-warmup 3 \
            --clean-corpora

      - name: Publish Markdown report to step summary
        if: always()
        shell: bash
        run: |
          if [ -f benchmarks/results/baseline_report.md ]; then
            cat benchmarks/results/baseline_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t005-benchmark-results
          path: benchmarks/results/
          if-no-files-found: warn
