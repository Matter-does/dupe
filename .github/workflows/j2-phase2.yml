name: J2 Phase 2 Research

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/j2-phase2.yml'

permissions:
  contents: read

env:
  J2_VERSION: 0.1.0
  J2_SHA256: 6fda8338791730cf7937362acd03e29247719e65785458e62988e1789c842e75

jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install exact J2
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/j2"
          mkdir -p "$d"
          cd "$d"
          curl -fsSL -o j2.tgz "https://github.com/JasnamSinghArora/j2/releases/download/v${J2_VERSION}/j2-${J2_VERSION}-aarch64-apple-darwin.tar.gz"
          printf '%s  j2.tgz\n' "$J2_SHA256" | shasum -a 256 -c -
          tar -xzf j2.tgz
          s="$(find "$d" -type f -name install.sh -print -quit)"
          test -n "$s"
          cd "$(dirname "$s")"
          chmod +x install.sh
          ./install.sh
          echo "$HOME/.j2/bin" >> "$GITHUB_PATH"

      - name: Record machine and CLI
        shell: bash
        run: |
          set -e
          echo '=== TARGET ==='
          uname -m
          sw_vers
          echo '=== VERSION ==='
          j2 --version
          echo '=== HELP ==='
          j2 --help

      - name: Probe language and collections
        shell: bash
        run: |
          set +e
          d="$RUNNER_TEMP/lang"
          mkdir -p "$d"

          run_case() {
            name="$1"
            program="$2"
            p="$d/${name}.j2"
            printf '%b\n' "$program" > "$p"
            echo "=== CASE: $name ==="
            j2 run "$p" 2>&1
            echo "STATUS=$?"
          }

          run_case string 'a = "hello"\nprint(a)'
          run_case integer 'n := 41\nprint(n)'
          run_case boolean 'ok = true\nprint(ok)'
          run_case array 'xs = [3, 1, 2]\nprint(xs)\nprint(len(xs))'
          run_case function 'func add(x: int, y: int) -> int = { give x + y }\nprint(add(1, 2))'
          run_case iteration 'xs = [3, 1, 2]\nfor x in xs { print(x) }'
          run_case mutation 'xs = [3, 1, 2]\nxs[0] = 9\nprint(xs)'
          run_case sorting 'xs = [3, 1, 2]\nprint(sort(xs))'
          exit 0

      - name: Probe namespace layout and map syntax
        shell: bash
        run: |
          set +e
          d="$RUNNER_TEMP/shape"
          mkdir -p "$d"

          run_case() {
            name="$1"
            program="$2"
            p="$d/${name}.j2"
            printf '%b\n' "$program" > "$p"
            echo "=== CASE: $name ==="
            j2 run "$p" 2>&1
            echo "STATUS=$?"
          }

          run_case fs_namespace 'print(fs)'
          run_case hash_namespace 'print(hash)'
          run_case json_namespace 'print(json)'
          run_case time_namespace 'print(time)'
          run_case sys_namespace 'print(sys)'
          run_case map_pairs 'm = [("b", 2), ("a", 1)]\nprint(m)'
          run_case empty_braces 'm = {}\nprint(m)'
          exit 0

      - name: Probe filesystem semantics
        shell: bash
        run: |
          set +e
          d="$RUNNER_TEMP/fs"
          mkdir -p "$d/sub"
          printf 'abc123' > "$d/a.txt"
          printf 'xyz' > "$d/sub/b.txt"

          run_case() {
            name="$1"
            expr="$2"
            p="$d/${name}.j2"
            printf 'print(%s)\n' "$expr" > "$p"
            echo "=== $expr ==="
            j2 run --allow-fs "$p" 2>&1
            echo "STATUS=$?"
          }

          run_case read_file 'fs.read_file("__F__")'
          run_case read_bytes 'fs.read_bytes("__F__")'
          run_case write_file 'fs.write_file("__O__","x")'
          run_case append_file 'fs.append_file("__O__","y")'
          run_case list_dir 'fs.list_dir("__D__")'
          run_case exists 'fs.exists("__F__")'
          run_case is_file 'fs.is_file("__F__")'
          run_case is_dir 'fs.is_dir("__D__")'
          run_case metadata 'fs.metadata("__F__")'
          run_case rename 'fs.rename("__F__","__R__")'
          run_case copy 'fs.copy("__F__","__C__")'
          run_case mkdir 'fs.mkdir("__M__")'
          exit 0
        env:
          DUMMY: unused

      - name: Probe filesystem nested values and path behavior
        shell: bash
        run: |
          set +e
          d="$RUNNER_TEMP/fs2"
          mkdir -p "$d/sub"
          printf 'abc123' > "$d/a.txt"
          printf 'xyz' > "$d/sub/b.txt"

          cat > "$d/p.j2" <<J2
          meta = fs.metadata("$d/a.txt")
          print(meta)
          print(meta["size"])
          print(meta["is_file"])
          print(meta["is_dir"])
          print(meta["modified_epoch"])
          J2

          echo '=== metadata field access ==='
          j2 run --allow-fs "$d/p.j2" 2>&1
          echo "STATUS=$?"

          cat > "$d/bytes.j2" <<J2
          b = fs.read_bytes("$d/a.txt")
          print(b)
          print(len(b))
          J2
          echo '=== read_bytes ==='
          j2 run --allow-fs "$d/bytes.j2" 2>&1
          echo "STATUS=$?"
          exit 0

      - name: Probe hashing semantics
        shell: bash
        run: |
          set +e
          d="$RUNNER_TEMP/hash"
          mkdir -p "$d"
          printf 'abc123' > "$d/a.txt"

          run_case() {
            name="$1"
            expr="$2"
            p="$d/${name}.j2"
            printf 'print(%s)\n' "$expr" > "$p"
            echo "=== $expr ==="
            j2 run --allow-fs "$p" 2>&1
            echo "STATUS=$?"
          }

          run_case sha256_text 'hash.sha256("abc123")'
          run_case sha512_text 'hash.sha512("abc123")'
          run_case md5_text 'hash.md5("abc123")'
          run_case xxhash_text 'hash.xxhash("abc123")'

          cat > "$d/filehash.j2" <<J2
          b = fs.read_bytes("$d/a.txt")
          print(hash.sha256(b))
          print(hash.sha512(b))
          print(hash.md5(b))
          print(hash.xxhash(b))
          J2
          echo '=== hash bytes from file ==='
          j2 run --allow-fs "$d/filehash.j2" 2>&1
          echo "STATUS=$?"
          exit 0

      - name: Probe JSON semantics
        shell: bash
        run: |
          set +e
          d="$RUNNER_TEMP/json"
          mkdir -p "$d"

          cat > "$d/p.j2" <<'J2'
          print(json.stringify("abc"))
          print(json.stringify(123))
          print(json.stringify(true))
          print(json.stringify([1, 2, 3]))
          print(json.parse("{\"b\":2,\"a\":1}"))
          x = json.parse("{\"b\":2,\"a\":1}")
          print(x)
          print(json.stringify(x))
          print(json.stringify_pretty(x))
          J2
          j2 run "$d/p.j2" 2>&1
          echo "STATUS=$?"
          exit 0

      - name: Probe argv and timing semantics
        shell: bash
        run: |
          set +e
          d="$RUNNER_TEMP/sem"
          mkdir -p "$d"

          cat > "$d/argv.j2" <<'J2'
          print(proc.argv)
          print(proc.argv())
          J2
          echo '=== proc.argv ==='
          j2 run "$d/argv.j2" one two 2>&1
          echo "STATUS=$?"

          cat > "$d/time.j2" <<'J2'
          a = time.now()
          b = time.now()
          print(a)
          print(b)
          print(time.elapsed_ms())
          J2
          echo '=== time ==='
          j2 run "$d/time.j2" 2>&1
          echo "STATUS=$?"
          exit 0

      - name: Probe capability enforcement and error behavior
        shell: bash
        run: |
          set +e
          d="$RUNNER_TEMP/errors"
          mkdir -p "$d"
          cat > "$d/ok.j2" <<'J2'
          print("ok")
          J2
          j2 run "$d/ok.j2" 2>&1
          echo "BASELINE_STATUS=$?"

          cat > "$d/overflow.j2" <<'J2'
          print(9223372036854775807 + 1)
          J2
          j2 run "$d/overflow.j2" 2>&1
          echo "OVERFLOW_STATUS=$?"
          exit 0

      - name: Probe native output and emit-native
        shell: bash
        run: |
          set +e
          d="$RUNNER_TEMP/native"
          mkdir -p "$d"
          cat > "$d/p.j2" <<'J2'
          xs = [5, 4, 3, 2, 1]
          total := 0
          for x in xs { total = total + x }
          print(total)
          J2
          j2 run "$d/p.j2" > "$d/i.txt" 2>&1
          is=$?
          j2 build "$d/p.j2" -o "$d/p" > "$d/b.txt" 2>&1
          bs=$?
          if [ "$bs" -eq 0 ]; then "$d/p" > "$d/n.txt" 2>&1; ns=$?; else ns=NA; fi
          echo '=== INTERPRETER ==='; cat "$d/i.txt"; echo "INTERPRETER_STATUS=$is"
          echo '=== BUILD ==='; cat "$d/b.txt"; echo "BUILD_STATUS=$bs"
          if [ "$bs" -eq 0 ]; then echo '=== NATIVE ==='; cat "$d/n.txt"; echo "NATIVE_STATUS=$ns"; diff -u "$d/i.txt" "$d/n.txt"; echo "DIFF_STATUS=$?"; fi
          echo '=== EMIT NATIVE ==='
          j2 emit-native "$d/p.j2" > "$d/emit.txt" 2>&1
          es=$?
          sed -n '1,260p' "$d/emit.txt"
          echo "EMIT_STATUS=$es"
          exit 0

      - name: Research marker
        run: echo 'Phase 2 probe completed; freeze only runtime-verified APIs.'
