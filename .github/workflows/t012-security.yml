name: T012 Security Hardening Gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'gui/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/t012-security.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'gui/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/t012-security.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  J2_VERSION: 0.1.0
  J2_SHA256: 6fda8338791730cf7937362acd03e29247719e65785458e62988e1789c842e75
  FROZEN_BASELINE_COMMIT: 630eb1f91e9e5134ba6351fddaccc697d2a56888
  T011_RELEASE_BASELINE: bd2f8c9c27822dbde1133a6ab93256c09e7be677

jobs:
  ubuntu-python-security:
    name: T012 Security Checks (Ubuntu / Python-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit frozen core and benchmarks untouched
        shell: bash
        run: |
          set -euo pipefail
          echo "Auditing frozen core boundary against $FROZEN_BASELINE_COMMIT..."
          git diff --exit-code "$FROZEN_BASELINE_COMMIT..HEAD" -- \
            src/scan.j2 src/hash.j2 src/group.j2 src/output.j2 benchmarks/

      - name: Run full automated test suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v

      - name: Run Phase 4 differential correctness verification
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/phase4_differential.py --offline

      - name: Run T012 security hardening verification harness
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/security/verify_t012_security.py --output-dir artifacts/security --skip-screenshots

  macos-j2-security:
    name: T012 Security Gate on macOS Apple Silicon (arm64 + J2)
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          echo "Architecture: $(uname -m)"
          test "$(uname -m)" = "arm64"

      - name: Install exact pinned J2 0.1.0
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/j2"
          mkdir -p "$d"
          cd "$d"
          curl -fsSL --retry 3 --retry-delay 2 -o j2.tgz \
            "https://github.com/JasnamSinghArora/j2/releases/download/v${J2_VERSION}/j2-${J2_VERSION}-aarch64-apple-darwin.tar.gz"
          printf '%s  j2.tgz\n' "$J2_SHA256" | shasum -a 256 -c -
          tar -xzf j2.tgz
          s="$(find "$d" -type f -name install.sh -print -quit)"
          test -n "$s"
          cd "$(dirname "$s")"
          chmod +x install.sh
          ./install.sh
          echo "$HOME/.j2/bin" >> "$GITHUB_PATH"

      - name: Verify exact J2 version
        shell: bash
        run: |
          set -euo pipefail
          v="$(j2 --version)"
          echo "Detected J2 version: $v"
          test "$v" = "j2 0.1.0"

      - name: Verify source formatting
        shell: bash
        run: |
          set -euo pipefail
          j2 fmt -w src/*.j2
          git diff --stat
          git diff --exit-code src/

      - name: Audit frozen core and benchmarks untouched
        shell: bash
        run: |
          set -euo pipefail
          echo "Auditing frozen boundaries against baseline $FROZEN_BASELINE_COMMIT..."
          git diff --exit-code "$FROZEN_BASELINE_COMMIT..HEAD" -- \
            src/scan.j2 src/hash.j2 src/group.j2 src/output.j2 benchmarks/

      - name: Run full automated test suite with live J2
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v

      - name: Run Phase 4 differential correctness verification
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/phase4_differential.py --offline

      - name: Build genuine native dupe executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          j2 build src/main.j2 -o build/dupe
          test -x build/dupe

      - name: Run authoritative T012 security verification harness
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/security/verify_t012_security.py --output-dir artifacts/security

      - name: Publish Security Summary to GitHub Step Summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/security/SECURITY_HARDENING_SUMMARY.md ]; then
            cat artifacts/security/SECURITY_HARDENING_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized security evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t012-security-hardening-evidence
          path: artifacts/security/
          if-no-files-found: error
