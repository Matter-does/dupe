name: J2 Native Capability Research

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/j2-native-capabilities.yml'

permissions:
  contents: read

env:
  J2_VERSION: 0.1.0
  J2_SHA256: 6fda8338791730cf7937362acd03e29247719e65785458e62988e1789c842e75

jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verify arm64
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Install exact J2
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/j2"
          mkdir -p "$d"
          cd "$d"
          curl -fsSL --retry 3 --retry-delay 2 -o j2.tgz \
            "https://github.com/JasnamSinghArora/j2/releases/download/v${J2_VERSION}/j2-${J2_VERSION}-aarch64-apple-darwin.tar.gz"
          printf '%s  j2.tgz\n' "$J2_SHA256" | shasum -a 256 -c -
          tar -xzf j2.tgz
          s="$(find "$d" -type f -name install.sh -print -quit)"
          test -n "$s"
          cd "$(dirname "$s")"
          chmod +x install.sh
          ./install.sh
          echo "$HOME/.j2/bin" >> "$GITHUB_PATH"

      - name: Prepare capability probe
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/cap"
          mkdir -p "$d"
          printf 'print(fs.exists("%s"))\n' "$d" > "$d/probe.j2"
          echo "CAP_DIR=$d" >> "$GITHUB_ENV"

      - name: Probe capability positions
        shell: bash
        run: |
          set +e
          d="$CAP_DIR"
          echo "=== STRINGS IN J2 ==="
          strings "$(which j2)" | grep -i "force_native" || echo "force_native: NOT FOUND"
          strings "$(which j2)" | grep -i "j_force" || echo "j_force: NOT FOUND"
          strings "$(which j2)" | grep -i "j2_force" || echo "j2_force: NOT FOUND"
          strings "$(which j2)" | grep -i "allow-fs" | head -n 10
          strings "$(which j2)" | grep -E "J2_[A-Z_]+" | sort -u || echo "no J2_ vars"
          strings "$(which j2)" | grep -E "J_[A-Z_]+" | sort -u || echo "no J_ vars"

          echo "=== COMPILE src/main.j2 ==="
          j2 build src/main.j2 -o "$d/dupe_bin" 2>&1
          echo "BUILD_DUPE_STATUS=$?"

          if [ -f "$d/dupe_bin" ]; then
            echo "=== STRINGS IN dupe_bin ==="
            strings "$d/dupe_bin" | grep -i "allow-fs" | head -n 10
            strings "$d/dupe_bin" | grep -E "J2_[A-Z_]+" | sort -u || echo "no J2_ vars in bin"
            strings "$d/dupe_bin" | grep -E "J_[A-Z_]+" | sort -u || echo "no J_ vars in bin"

            mkdir -p "$d/testdir"
            echo "hello" > "$d/testdir/a.txt"
            echo "hello" > "$d/testdir/b.txt"

            echo "--- Test 1: plain binary ---"
            "$d/dupe_bin" "$d/testdir" --json 2>&1 || true

            echo "--- Test 2: binary with --allow-fs first ---"
            "$d/dupe_bin" --allow-fs "$d/testdir" --json 2>&1 || true

            echo "--- Test 3: J2_ALLOW_FS=1 ---"
            J2_ALLOW_FS=1 "$d/dupe_bin" "$d/testdir" --json 2>&1 || true

            echo "--- Test 4: ALLOW_FS=1 ---"
            ALLOW_FS=1 "$d/dupe_bin" "$d/testdir" --json 2>&1 || true

            echo "--- Test 5: J2_CAPABILITIES=allow-fs ---"
            J2_CAPABILITIES=allow-fs "$d/dupe_bin" "$d/testdir" --json 2>&1 || true

            echo "--- Test 6: Probe J2 sorting of nested arrays ---"
            printf 'print(sort([["b", 1], ["a", 2]]))\n' > "$d/sort_probe.j2"
            j2 run "$d/sort_probe.j2" 2>&1 || true

            printf 'print(sort(["beta", "alpha"]))\n' > "$d/sort_str.j2"
            j2 run "$d/sort_str.j2" 2>&1 || true

            echo "--- Test 7: Probe J2 symlink behavior ---"
            mkdir -p "$d/symlink_test/real"
            echo "symlink target" > "$d/symlink_test/real/file.txt"
            ln -s "$d/symlink_test/real" "$d/symlink_test/link_dir"
            ln -s "$d/symlink_test/real/file.txt" "$d/symlink_test/link_file.txt"

            printf 'print("is_dir link_dir:", fs.is_dir("%s/symlink_test/link_dir"))\n' "$d" > "$d/sym_probe.j2"
            printf 'print("is_file link_file:", fs.is_file("%s/symlink_test/link_file.txt"))\n' "$d" >> "$d/sym_probe.j2"
            printf 'print("list_dir:", fs.list_dir("%s/symlink_test"))\n' "$d" >> "$d/sym_probe.j2"
            j2 --allow-fs run "$d/sym_probe.j2" 2>&1 || true
          fi
          exit 0

      - name: Research marker
        shell: bash
        run: echo 'J2 native capability placement probe completed; freeze only observed behavior.'
