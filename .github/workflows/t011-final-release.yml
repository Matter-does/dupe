name: T011 Final Release Gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'gui/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/t011-final-release.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'gui/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/t011-final-release.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  J2_VERSION: 0.1.0
  J2_SHA256: 6fda8338791730cf7937362acd03e29247719e65785458e62988e1789c842e75
  FROZEN_BASELINE_COMMIT: 630eb1f91e9e5134ba6351fddaccc697d2a56888

jobs:
  macos-final-release-gate:
    name: T011 Final Release Gate on macOS Apple Silicon (arm64)
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          echo "Architecture: $(uname -m)"
          test "$(uname -m)" = "arm64"

      - name: Install exact J2 0.1.0
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/j2"
          mkdir -p "$d"
          cd "$d"
          curl -fsSL --retry 3 --retry-delay 2 -o j2.tgz \
            "https://github.com/JasnamSinghArora/j2/releases/download/v${J2_VERSION}/j2-${J2_VERSION}-aarch64-apple-darwin.tar.gz"
          printf '%s  j2.tgz\n' "$J2_SHA256" | shasum -a 256 -c -
          tar -xzf j2.tgz
          s="$(find "$d" -type f -name install.sh -print -quit)"
          test -n "$s"
          cd "$(dirname "$s")"
          chmod +x install.sh
          ./install.sh
          echo "$HOME/.j2/bin" >> "$GITHUB_PATH"

      - name: Verify exact J2 version
        shell: bash
        run: |
          set -euo pipefail
          v="$(j2 --version)"
          echo "Detected J2 version: $v"
          test "$v" = "j2 0.1.0"

      - name: Verify source formatting
        shell: bash
        run: |
          set -euo pipefail
          j2 fmt -w src/*.j2
          git diff --stat
          git diff --exit-code src/

      - name: Verify frozen Phase 3 core and benchmarks untouched
        shell: bash
        run: |
          set -euo pipefail
          echo "Auditing frozen boundaries against baseline $FROZEN_BASELINE_COMMIT..."
          git diff --exit-code "$FROZEN_BASELINE_COMMIT..HEAD" -- \
            src/scan.j2 src/hash.j2 src/group.j2 src/output.j2 benchmarks/

      - name: Run full automated test suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v

      - name: Run Phase 4 differential correctness verification
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/phase4_differential.py --offline

      - name: Build genuine native dupe executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          j2 build src/main.j2 -o build/dupe
          test -x build/dupe
          echo "Built standalone native binary:"
          ls -la build/dupe

      - name: Run authoritative T010 demo verification harness
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/verify_t010_demo.py --native-bin build/dupe --output-dir artifacts/t010

      - name: Run authoritative T011 final release evidence synthesis
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/verify_t011_final_release.py --native-bin build/dupe --output-dir artifacts/t011

      - name: Smoke-test canonical evaluator commands against demo corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/canonical_evaluator
          python3 tests/demo_corpus.py --output build/canonical_evaluator/corpus --clean

          echo "1. Smoke test native duplicate scan:"
          J2_ALLOW_FS=1 ./build/dupe build/canonical_evaluator/corpus > build/canonical_evaluator/dup_native.txt
          J2_ALLOW_FS=1 ./build/dupe build/canonical_evaluator/corpus --json > build/canonical_evaluator/dup_native.json

          echo "2. Smoke test native checksum inventory:"
          J2_ALLOW_FS=1 ./build/dupe checksum build/canonical_evaluator/corpus > build/canonical_evaluator/chk_native.txt
          J2_ALLOW_FS=1 ./build/dupe checksum build/canonical_evaluator/corpus --json > build/canonical_evaluator/chk_native.json

          echo "3. Smoke test interpreter duplicate scan:"
          j2 --allow-fs src/main.j2 build/canonical_evaluator/corpus --json > build/canonical_evaluator/dup_interp.json

          echo "4. Smoke test interpreter checksum inventory:"
          j2 --allow-fs src/main.j2 checksum build/canonical_evaluator/corpus --json > build/canonical_evaluator/chk_interp.json

          echo "5. Byte-for-byte parity assertion:"
          cmp build/canonical_evaluator/dup_native.json build/canonical_evaluator/dup_interp.json
          cmp build/canonical_evaluator/chk_native.json build/canonical_evaluator/chk_interp.json
          echo "All canonical evaluator commands smoke-tested successfully with 100% parity."

      - name: Publish Markdown summary to step summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/t011/final_release_summary.md ]; then
            cat artifacts/t011/final_release_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload final release evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t011-final-release-evidence
          path: artifacts/t011/
          if-no-files-found: error
